openapi: 3.0.0
info:
  title: Group Features API
  description: API endpoints for group features in Frontend Mobile
  version: 1.0.0

servers:
  - url: http://{host}:5000
    description: BFF Server
    variables:
      host:
        default: localhost

paths:
  /conversations/{conversationId}/disband:
    post:
      summary: Disband a group conversation
      description: Only owner can disband. Fails if only one member (owner).
      security:
        - bearerAuth: []
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Group disbanded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Group disbanded successfully"
                  membersRemoved:
                    type: integer
                    example: 5
                  invitesCancelled:
                    type: integer
                    example: 3
        '400':
          description: Cannot leave (only owner) or partial failure
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      error:
                        type: string
                        example: "CONVERSATION_CANNOT_LEAVE"
                      message:
                        type: string
                        example: "You cannot leave this group"
                  - type: object
                    properties:
                      error:
                        type: string
                        example: "PARTIAL_FAILURE"
                      message:
                        type: string
                        example: "Some invites could not be cancelled"
                      membersRemoved:
                        type: integer
                      invitesCancelled:
                        type: integer
                      failedInvites:
                        type: array
                        items:
                          type: object
                          properties:
                            inviteId:
                              type: string
                            reason:
                              type: string
        '403':
          description: Not authorized (not owner)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Conversation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /conversations/{conversationId}/invites:
    post:
      summary: Send group invites
      description: Send invites to users to join a group. Owner and admin only.
      security:
        - bearerAuth: []
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - userIds
              properties:
                userIds:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    type: string
                    format: uuid
                message:
                  type: string
                  maxLength: 500
                expiresInHours:
                  type: integer
                  minimum: 1
                  maximum: 168
                  default: 168
      responses:
        '201':
          description: Invites sent successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  acceptedCount:
                    type: integer
                  skippedCount:
                    type: integer
                  inviteIds:
                    type: array
                    items:
                      type: string
                  skippedDetails:
                    type: array
                    items:
                      type: object
                      properties:
                        userId:
                          type: string
                        reason:
                          type: string
                          enum: [already_in_group, pending_invite_exists, user_not_found]
        '403':
          description: Not authorized (not owner/admin)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Conversation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:
      summary: Get conversation invites
      description: Get invites for a specific conversation. Owner and admin only.
      security:
        - bearerAuth: []
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: status
          in: query
          schema:
            type: string
            enum:
              - pending
              - accepted
              - rejected
              - cancelled
              - expired
            default: pending
        - name: sort
          in: query
          schema:
            type: string
            default: createdAt:desc
            description: "Format: field:direction. Fields: createdAt, expiresAt. Directions: asc, desc"
      responses:
        '200':
          description: Invites retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteListResponse'
        '403':
          description: Not authorized (member)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Conversation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /conversations/invites/pending:
    get:
      summary: Get pending invites for current user
      description: Get all pending invites for the authenticated user.
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: status
          in: query
          schema:
            type: string
            enum:
              - pending
              - accepted
              - rejected
              - cancelled
              - expired
            default: pending
        - name: sort
          in: query
          schema:
            type: string
            default: createdAt:desc
            description: "Format: field:direction. Fields: createdAt, expiresAt. Directions: asc, desc"
      responses:
        '200':
          description: Pending invites retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteListResponse'

  /conversations/{conversationId}/invites/{inviteId}/accept:
    post:
      summary: Accept a group invite
      description: Accept an invite to join a group.
      security:
        - bearerAuth: []
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: inviteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Invite accepted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Group invite accepted"
                  conversationId:
                    type: string
                    format: uuid
                  status:
                    type: string
                    enum: [accepted]
                  joinedAt:
                    type: string
                    format: date-time
        '400':
          description: Invite expired, already accepted, or already in group
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - type: object
                    properties:
                      error:
                        type: string
                        enum: [GROUP_INVITE_EXPIRED, CONVERSATION_ALREADY_MEMBER, GROUP_INVITE_INVALID_STATUS]
                      message:
                        type: string
        '404':
          description: Invite not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /conversations/{conversationId}/invites/{inviteId}/reject:
    post:
      summary: Reject a group invite
      description: Reject an invite to join a group.
      security:
        - bearerAuth: []
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: inviteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Invite rejected successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Group invite rejected"
                  status:
                    type: string
                    enum: [rejected]
                  respondedAt:
                    type: string
                    format: date-time
        '400':
          description: Invite expired or invalid status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Invite not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /conversations/{conversationId}/invites/{inviteId}/cancel:
    post:
      summary: Cancel a group invite
      description: Cancel an invite. Inviter, owner, or admin (if not inviter) can cancel.
      security:
        - bearerAuth: []
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: inviteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Invite cancelled successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Group invite cancelled"
                  status:
                    type: string
                    enum: [cancelled]
        '400':
          description: Invalid status (already accepted/rejected/expired)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum: [GROUP_INVITE_INVALID_STATUS]
                  message:
                    type: string
        '403':
          description: Not authorized (member or admin canceling their own invite)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Invite not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          enum:
            - CONVERSATION_NOT_FOUND
            - CONVERSATION_NOT_MEMBER
            - CONVERSATION_PERMISSION_DENIED
            - CONVERSATION_MEMBER_NOT_FOUND
            - CONVERSATION_INVALID_TYPE
            - CONVERSATION_ALREADY_MEMBER
            - CONVERSATION_CANNOT_LEAVE
            - USER_NOT_FOUND
            - GROUP_INVITE_NOT_FOUND
            - GROUP_INVITE_ALREADY_EXISTS
            - GROUP_INVITE_EXPIRED
            - GROUP_INVITE_INVALID_STATUS
        message:
          type: string

    Invite:
      type: object
      properties:
        id:
          type: string
          format: uuid
        conversationId:
          type: string
          format: uuid
        inviterUserId:
          type: string
          format: uuid
        invitedUserId:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, accepted, rejected, cancelled, expired]
        message:
          type: string
          nullable: true
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        respondedAt:
          type: string
          format: date-time
          nullable: true
        conversation:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            avatarUrl:
              type: string
              nullable: true
            memberCount:
              type: integer
        inviter:
          type: object
          properties:
            id:
              type: string
              format: uuid
            fullName:
              type: string
            avatarUrl:
              type: string
              nullable: true

    InviteListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Invite'
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
